name: ai-club
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_club
      MYSQL_USER: ai_club
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D ai_club -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [private]
  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/ai_club?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USER: ai_club
      DB_PASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_USER: ${BOOTSTRAP_USER:?Set BOOTSTRAP_USER}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
      TZ: Asia/Shanghai
    volumes:
      - uploads:/data/uploads
    networks: [private]
  web:
    build: ../frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [private]
volumes:
  db-data:
  uploads:
networks:
  private:
